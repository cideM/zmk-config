manifest:
  remotes:
    - name: petejohanson
      url-base: https://github.com/petejohanson
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      # The Blank Slate board definition needs ZMK v0.3 (it does not build on
      # ZMK main since the Zephyr 4.1 upgrade). Same pins as the official
      # petejohanson/blank-slate-zmk-config template.
      revision: v0.3
      import: app/west.yml
    - name: blank-slate-zmk-module
      remote: petejohanson
      revision: v0.3
  self:
    path: config
